addScene((sc, cam) => {
  const sky = new THREE.Mesh(new THREE.SphereGeometry(300, 32, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, uniforms: { k: { value: 0 } }, fog: false,
    vertexShader: `varying vec3 vP; void main(){ vP=normalize(position); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform float k; varying vec3 vP; void main(){ float y=clamp(vP.y*2.5,0.,1.); vec3 hor=mix(vec3(1.,.45,.2),vec3(.6,.2,.35),k); vec3 top=mix(vec3(.25,.15,.45),vec3(.04,.03,.12),k); gl_FragColor=vec4(mix(hor,top,pow(y,.6)),1.); }` }));

  for (let i = 0; i < 7; i++) for (const s of [-1, 1]) { const L = makeLamp(); L.grp.position.set(s * 8, 0, 4 - i * 18 + (s > 0 ? 9 : 0)); L.grp.rotation.y = s > 0 ? Math.PI : 0; L.light.castShadow = i < 2; sc.add(L.grp); L.idx = i; lamps.push(L); }

  const winTex = []; for (let v = 0; v < 3; v++) winTex.push(canvasTex(256, 512, (g, w, h) => { g.fillStyle = ['#c9b79c', '#b8c4c9', '#d8c3a5'][v]; g.fillRect(0, 0, w, h); for (let y = 0; y < 8; y++) for (let x = 0; x < 4; x++) { const lit = hash(v * 100 + y * 9 + x) > .45; g.fillStyle = lit ? '#ffcf73' : '#2b2f45'; g.fillRect(18 + x * 60, 20 + y * 62, 38, 40); g.fillStyle = '#777'; g.fillRect(14 + x * 60, 60 + y * 62, 46, 6); } }));
  const blds = [];
  for (let i = 0; i < 12; i++) for (const s of [-1, 1]) {
    const hgt = 14 + hash(i * 3 + s) * 14; const b = new THREE.Mesh(new THREE.BoxGeometry(10, hgt, 10), new THREE.MeshStandardMaterial({ map: winTex[(i + (s > 0 ? 1 : 0)) % 3], emissive: '#ffffff', emissiveMap: winTex[(i + (s > 0 ? 1 : 0)) % 3], emissiveIntensity: 0, roughness: .9 }));
    b.position.set(s * 18, hgt / 2, -i * 14); b.castShadow = true; sc.add(b); blds.push(b);
    const roof = new THREE.Mesh(new THREE.ConeGeometry(7.6, 3, 4), std('#8a3b2a')); roof.rotation.y = Math.PI / 4; roof.position.set(s * 18, hgt + 1.5, -i * 14); sc.add(roof);
  }
  // top
  const ballTex = canvasTex(256, 128, (g, w, h) => { g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.fillStyle = '#111'; for (let i = 0; i < 10; i++) { g.beginPath(); const x = (i % 5) * 52 + 26 + (Math.floor(i / 5) * 26), y = 32 + Math.floor(i / 5) * 64; for (let k = 0; k < 5; k++) { const a = k / 5 * Math.PI * 2; g.lineTo(x + Math.cos(a) * 14, y + Math.sin(a) * 14); } g.fill(); } });
  const ball = new THREE.Mesh(new THREE.SphereGeometry(.6, 32, 16), new THREE.MeshStandardMaterial({ map: ballTex, roughness: .5 })); ball.castShadow = true; sc.add(ball);

  const sun = new THREE.DirectionalLight('#ff9a5a', 2); sun.position.set(-20, 10, -60); sc.add(sun);

    const dusk = clamp(lt / 4.5);
    sky.material.uniforms.k.value = dusk; amb.intensity = lerp(1.2, .35, dusk); sun.intensity = lerp(2, .2, dusk);
    lamps.forEach((L, i) => {
      const t0 = yan + L.idx * .07 + (i % 2) * .03;
      let on = lt > t0 ? 1 : 0;
      if (lt > t0 && lt < t0 + .35) on = hash(Math.floor(lt * 30) + i) > .4 ? 1 : .15; // titreme
      L.bulbMat.emissiveIntensity = on * 6; L.light.intensity = on * 220; L.cone.material.opacity = on * .07;
    });
    blds.forEach((b, i) => b.material.emissiveIntensity = clamp((lt - 1 - hash(i) * 2) * 2) * .55);
    const bz = lerp(-30, 6, clamp((lt - .2) / 4.6));
    ball.position.set(Math.sin(lt * 1.3) * 1.5, .6 + Math.abs(Math.sin(lt * 5)) * .8 * (1 - clamp(lt / 4.8)), bz); ball.rotation.x = lt * 8;
    cam.position.set(0 + Math.sin(lt * .4) * .5, lerp(1.6, 3.2, ease(lt / 5)), lerp(18, 9, ease(lt / 5))); cam.lookAt(0, lerp(3, 4.5, ease(lt / 5)), -40);

// ---------- post ----------
const composer = new EffectComposer(renderer);
const rp = new RenderPass(scenes[0].sc, scenes[0].cam); composer.addPass(rp);
const bloom = new UnrealBloomPass(new THREE.Vector2(W / 2, H / 2), .32, .4, .93); composer.addPass(bloom);
const vhs = new ShaderPass({
  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, glitch: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time, glitch; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    void main(){ vec2 uv=vUv; float fr=floor(time*30.);
      float band=floor(uv.y*48.); float r=h(vec2(band,fr)); float off=(r-.5)*.09*glitch*step(.55,r);
      off += sin(uv.y*900.+time*40.)*.0008*glitch; uv.x+=off;
      float tr = smoothstep(.0,.02,abs(uv.y-fract(time*.11)) ) ; uv.x += (1.-tr)*.004;
      float ca=.0016+glitch*.012;
      vec3 c=vec3(texture2D(tDiffuse,uv+vec2(ca,0)).r, texture2D(tDiffuse,uv).g, texture2D(tDiffuse,uv-vec2(ca,0)).b);
      c*= .93+.07*sin(uv.y*1920.*1.5708);
      c+= (h(uv*vec2(1080.,1920.)+fr)-.5)*(.06+glitch*.25);
      vec2 v=vUv-.5; c*=1.-dot(v*vec2(1.,.75),v*vec2(1.,.75))*.9;
      c=mix(c, c*vec3(1.04,.98,1.06), .5);
      gl_FragColor=vec4(c,1.); }`
});
composer.addPass(new OutputPass()); composer.addPass(vhs);

// ---------- overlay ----------
const capEl = document.querySelector('#cap div'), chapEl = document.querySelector('#chap span'), ctaEl = document.getElementById('cta'), flashEl = document.getElementById('flash');
const dateEl = document.getElementById('date'), playEl = document.getElementById('play');
const CHAPS = [null, '#1 KASET', '#2 TÜPLÜ TV', '#3 TELEFON KARTI', '#4 DİSKET', '#5 SANAL BEBEK', '#6 SOKAK LAMBASI', null];
let lastCap = null;
function fmt(s) { return s.replace(/\*([^*]+)\*/g, '<span class="hl">$1</span>'); }
function overlay(t, si) {
  const c = CAPS.find(c => t >= c.t0 - .05 && t < c.t1 + (c.line === 7 ? .4 : .05));
  if (c) { if (c !== lastCap) { capEl.innerHTML = fmt(c.text); lastCap = c; } const k = t - c.t0; capEl.style.transform = `scale(${lerp(.6, 1, back(k / .22))}) rotate(${lerp(-4, 0, eout(k / .2))}deg)`; capEl.style.opacity = clamp(k / .08); }
  else { capEl.style.opacity = 0; lastCap = null; }
  const ch = CHAPS[si];
  if (ch) { chapEl.parentElement.style.opacity = 1; chapEl.textContent = ch; const k = t - S[si]; chapEl.style.transform = `scale(${back(k / .35)})`; }
  else chapEl.parentElement.style.opacity = 0;
  const sec = Math.floor(t); dateEl.textContent = `KAS. 19 1996  0:00:${String(sec).padStart(2, '0')}`;
  playEl.textContent = t < 1.15 ? '◀◀ REW' : 'PLAY ▶';
  playEl.style.opacity = t < 1.15 ? (Math.floor(t * 4) % 2 ? 1 : .2) : 1;
  ctaEl.style.opacity = t > ST[7] + 2.9 ? 1 : 0; ctaEl.style.transform = `scale(${t > ST[7] + 2.9 ? back((t - ST[7] - 2.9) / .4) * (1 + .04 * Math.sin(t * 9)) : 0})`;
  // beyaz flaş: açılış darbesi + "Tamam" + lamba
  const fl = Math.max(Math.exp(-Math.abs(t - ST[0]) * 10) * (t >= ST[0] ? .7 : .2), t > TAMAM ? Math.exp(-(t - TAMAM) * 9) * .35 : 0, t > S[7] ? Math.exp(-(t - S[7]) * 8) * .5 : 0);
  flashEl.style.opacity = fl;
}

window.renderFrame = (t) => {
  let si = 0; for (let i = 0; i < S.length; i++) if (t >= S[i]) si = i;
  const s = scenes[si]; s.upd(t - S[si], t);
  rp.scene = s.sc; rp.camera = s.cam;
  let g = 0; for (let i = 1; i < S.length; i++) g = Math.max(g, Math.exp(-Math.abs(t - S[i]) * 9));
  g = Math.max(g, t > TAMAM ? Math.exp(-(t - TAMAM) * 10) * .6 : 0, t < 1.15 ? .35 + .3 * Math.sin(t * 20) : 0, t > TL.total - 1.6 ? clamp((t - TL.total + 1.6) / 1) : 0);
  vhs.uniforms.time.value = t; vhs.uniforms.glitch.value = g;
  composer.render();
  overlay(t, si);
};
window.READY = true;
