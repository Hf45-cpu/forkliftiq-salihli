  uniforms: { tDiffuse: { value: null }, time: { value: 0 }, glitch: { value: 0 } },
  vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
  fragmentShader: `uniform sampler2D tDiffuse; uniform float time, glitch; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    void main(){ vec2 uv=vUv; float fr=floor(time*30.);
      float band=floor(uv.y*48.); float r=h(vec2(band,fr)); float off=(r-.5)*.09*glitch*step(.55,r);
      off += sin(uv.y*900.+time*40.)*.0008*glitch; uv.x+=off;
      float tr = smoothstep(.0,.02,abs(uv.y-fract(time*.11)) ) ; uv.x += (1.-tr)*.004;
      float ca=.0016+glitch*.012;
      vec3 c=vec3(texture2D(tDiffuse,uv+vec2(ca,0)).r, texture2D(tDiffuse,uv).g, texture2D(tDiffuse,uv-vec2(ca,0)).b);
      c*= .93+.07*sin(uv.y*1920.*1.5708);
      c+= (h(uv*vec2(1080.,1920.)+fr)-.5)*(.06+glitch*.25);
      vec2 v=vUv-.5; c*=1.-dot(v*vec2(1.,.75),v*vec2(1.,.75))*.9;
      c=mix(c, c*vec3(1.04,.98,1.06), .5);
      gl_FragColor=vec4(c,1.); }`
});

  else { capEl.style.opacity = 0; lastCap = null; }
  capBox.style.top = si === 6 ? '470px' : '1210px';
  const ch = CHAPS[si];
  if (ch) { chapEl.parentElement.style.opacity = 1; chapEl.textContent = ch; chapEl.style.transform = `scale(${back((t - S[si]) / .35)})`; } else chapEl.parentElement.style.opacity = 0;
  dateEl.textContent = `KAS. 20 1994  0:00:${String(Math.floor(t)).padStart(2, '0')}`;

}
window.renderFrame = (t) => {
  let si = 0; for (let i = 0; i < S.length; i++) if (t >= S[i]) si = i;
  const s = scenes[si]; s.upd(t - S[si], t); rp.scene = s.sc; rp.camera = s.cam;
  let g = 0; for (let i = 1; i < S.length; i++) g = Math.max(g, Math.exp(-Math.abs(t - S[i]) * 9));
  g = Math.max(g, t < .85 ? .35 + .3 * Math.sin(t * 20) : 0, t > TL.total - 1.0 ? clamp((t - TL.total + 1.0) / .8) : 0);

};
