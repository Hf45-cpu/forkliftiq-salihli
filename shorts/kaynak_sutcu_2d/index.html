<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Cap;src:url(/fonts/DejaVuSans-Bold.ttf)}
@font-face{font-family:Osd;src:url(/fonts/DejaVuSansMono-Bold.ttf)}
html,body{margin:0;background:#000;overflow:hidden}
#wrap{position:relative;width:1080px;height:1920px}
canvas{display:block}
#ov{position:absolute;inset:0;pointer-events:none}
.osd{position:absolute;font-family:Osd;color:#fff;font-size:46px;letter-spacing:2px;text-shadow:3px 3px 0 rgba(0,0,0,.6),0 0 12px rgba(255,255,255,.35)}
#play{left:70px;top:150px} #sp{right:80px;top:150px} #date{left:70px;top:215px;font-size:38px;opacity:.92}
#series{position:absolute;left:0;right:0;top:268px;text-align:center;font-family:Cap;font-size:34px;color:#ffe53b;letter-spacing:3px;text-shadow:0 3px 0 #000,0 0 14px rgba(0,0,0,.6)}
#chap{position:absolute;left:0;right:0;top:330px;text-align:center;font-family:Cap;font-size:44px;color:#fff}
#chap span{display:inline-block;padding:10px 28px;background:linear-gradient(90deg,#ff2bd6,#7b2bff);border-radius:14px;box-shadow:0 8px 0 #2a0b4f,0 0 30px rgba(255,43,214,.6);transform-origin:center}
#cap{position:absolute;left:60px;right:60px;top:1250px;text-align:center;font-family:Cap;font-size:84px;line-height:1.12;color:#fff;-webkit-text-stroke:14px #000;paint-order:stroke fill;text-shadow:0 10px 0 rgba(0,0,0,.55)}
#cap .hl{color:#ffe53b} #cap div{display:inline-block;transform-origin:center bottom}
#flash{position:absolute;inset:0;background:#fff;opacity:0}
#grain{position:absolute;inset:0;opacity:.07;mix-blend-mode:overlay}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 55%,rgba(0,0,0,.45) 100%)}
#scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,.08) 0 2px,rgba(0,0,0,0) 2px 4px)}
</style></head>
<body><div id="wrap"><canvas id="c" width="1080" height="1920"></canvas>
<div id="ov"><canvas id="grain" width="540" height="960"></canvas><div id="scan"></div><div id="vig"></div>
 <div class="osd" id="play">PLAY ▶</div><div class="osd" id="sp">SP</div><div class="osd" id="date">KAS. 20 1994</div>
 <div id="series">KAYBOLAN MESLEKLER</div><div id="chap"><span></span></div><div id="cap"><div></div></div><div id="flash"></div>
</div></div>
<script>
(async () => {
await document.fonts.load('84px Cap'); await document.fonts.load('46px Osd');
const TL = await (await fetch('/timeline.json')).json(), CAPS = await (await fetch('/captions.json')).json();
const S = TL.scenes, ST = TL.starts, D = TL.durs, L = (i, f) => ST[i] + f;
const capT = (sub) => CAPS.find(c => c.text.includes(sub)).t0;
const SUB = CAPS.find(c => c.text.includes('ABONE')).t0, PRESS = SUB + .55, HOOK = (CAPS.find(c => c.text.includes('GELDİ')) || { t0: 3 }).t0;
const cv = document.getElementById('c'), x = cv.getContext('2d'); const W = 1080, H = 1920;
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), lerp = (a, b, t) => a + (b - a) * t;
const ease = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }, eout = t => 1 - Math.pow(1 - clamp(t), 3);
const back = t => { t = clamp(t); const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const hash = n => { const s = Math.sin(n * 127.1 + 311.7) * 43758.5453; return s - Math.floor(s); };
const OL = '#2b1d14';   // kontur rengi
// ---------- çizim yardımcıları ----------
function shape(fn, fill, stroke = OL, lw = 7) { x.beginPath(); fn(); if (fill) { x.fillStyle = fill; x.fill(); } if (stroke) { x.lineWidth = lw; x.strokeStyle = stroke; x.lineJoin = 'round'; x.lineCap = 'round'; x.stroke(); } }
const rr = (X, Y, w, h, r) => () => x.roundRect(X, Y, w, h, r);
const circ = (X, Y, r) => () => x.arc(X, Y, r, 0, Math.PI * 2);
const ell = (X, Y, rx, ry, rot = 0) => () => x.ellipse(X, Y, rx, ry, rot, 0, Math.PI * 2);
function grad(y0, y1, stops) { const g = x.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => g.addColorStop(o, c)); return g; }
function sky(top, bot, sunY = null, sunC = '#ffd27a') { x.fillStyle = grad(0, H, [[0, top], [1, bot]]); x.fillRect(-2000, -2000, W + 4000, H + 4000); if (sunY !== null) { const g = x.createRadialGradient(780, sunY, 10, 780, sunY, 260); g.addColorStop(0, sunC); g.addColorStop(.35, sunC + 'cc'); g.addColorStop(1, sunC + '00'); x.fillStyle = g; x.fillRect(400, sunY - 300, 800, 600); shape(circ(780, sunY, 90), sunC, null); } }
function cloud(X, Y, s, c = '#fff8ee') { x.save(); x.translate(X, Y); x.scale(s, s); shape(() => { x.arc(0, 0, 50, Math.PI, 0); x.arc(60, -20, 60, Math.PI, 0); x.arc(130, 0, 45, Math.PI, 0); x.closePath(); }, c, null); x.restore(); }
function bubble(X, Y, text, fill = '#fff', fs = 60, tail = 'down') {
  x.font = `bold ${fs}px Cap`; const w = x.measureText(text).width + 70, h = fs + 50;
  shape(() => { x.roundRect(X - w / 2, Y - h / 2, w, h, 30); if (tail === 'down') { x.moveTo(X - 30, Y + h / 2 - 2); x.lineTo(X - 10, Y + h / 2 + 40); x.lineTo(X + 20, Y + h / 2 - 2); } }, fill);
  x.fillStyle = '#111'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, X, Y + 4);
}
function label(X, Y, text, bg, fg, fs = 60, rot = 0) { x.save(); x.translate(X, Y); x.rotate(rot); x.font = `bold ${fs}px Cap`; const w = x.measureText(text).width + 60, h = fs + 34; shape(rr(-w / 2, -h / 2, w, h, 20), bg, OL, 7); x.fillStyle = fg; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(text, 0, 4); x.restore(); }
// ---------- karakterler ----------
function man(X, Y, s, p = {}) {     // sütçü: kasket, bıyık, yelek
  const { armR = 0, armL = 0, leg = 0, head = 0, wave = 0 } = p;
  x.save(); x.translate(X, Y); x.scale(s, s);
  shape(ell(0, 6, 70, 14), 'rgba(0,0,0,.18)', null);
  for (const [sx, ph] of [[-22, 0], [22, Math.PI]]) { x.save(); x.translate(sx, -150); x.rotate(Math.sin(leg + ph) * .35); shape(rr(-16, 0, 32, 140, 14), '#3b3f4a'); shape(rr(-22, 128, 50, 26, 12), '#1d1d1d'); x.restore(); }
  shape(rr(-55, -300, 110, 165, 40), '#9cc3e6');
  shape(() => { x.moveTo(-55, -270); x.lineTo(-55, -150); x.lineTo(-12, -150); x.lineTo(-12, -290); x.closePath(); }, '#6b4a2f'); shape(() => { x.moveTo(55, -270); x.lineTo(55, -150); x.lineTo(12, -150); x.lineTo(12, -290); x.closePath(); }, '#6b4a2f');
  shape(rr(-55, -160, 110, 18, 6), '#2a2a2a');
  for (const [sx, a, item] of [[-55, armL, p.itemL], [55, armR, p.itemR]]) { x.save(); x.translate(sx, -285); x.rotate(a); shape(rr(-15, 0, 30, 130, 14), '#9cc3e6'); shape(circ(0, 135, 17), '#e0ac82'); if (item) { x.translate(0, 140); item(); } x.restore(); }
  x.save(); x.translate(0, -330); x.rotate(head);
  shape(circ(0, 0, 52), '#e0ac82'); shape(circ(-52, 4, 12), '#e0ac82');
  shape(circ(-17, -6, 6), '#1d1d1d', null); shape(circ(17, -6, 6), '#1d1d1d', null);
  shape(() => { x.moveTo(-34, 22); x.quadraticCurveTo(-18, 8, 0, 18); x.quadraticCurveTo(18, 8, 34, 22); x.quadraticCurveTo(16, 30, 0, 24); x.quadraticCurveTo(-16, 30, -34, 22); }, '#2a1a10', null);
  shape(circ(0, 8, 9), '#d49a70', null);
  shape(() => { x.ellipse(0, -36, 58, 24, 0, Math.PI, 0); x.lineTo(80, -30); x.quadraticCurveTo(60, -18, 0, -24); x.closePath(); }, '#4a4f57');
  x.restore(); x.restore();
}
function mom(X, Y, s, p = {}) {     // yazmalı anne (bel üstü)
  x.save(); x.translate(X, Y); x.scale(s, s);
  shape(rr(-80, -40, 160, 260, 60), '#7a3a6a');
  shape(circ(0, -100, 55), '#e8b48e');
  shape(() => { x.arc(0, -105, 66, Math.PI * .95, Math.PI * 2.05); x.lineTo(60, -40); x.quadraticCurveTo(0, -20, -60, -40); x.closePath(); }, '#e84d5b');
  for (let i = 0; i < 6; i++) shape(circ(-40 + i * 16, -140 + Math.sin(i) * 6, 5), '#fff', null);
  shape(circ(-18, -100, 6), '#1d1d1d', null); shape(circ(18, -100, 6), '#1d1d1d', null);
  shape(() => { x.arc(0, -80, 16, .2, Math.PI - .2); }, null, OL, 5);
  x.save(); x.translate(70, 0); x.rotate(p.arm ?? -1.2); shape(rr(-18, 0, 36, 150, 16), '#7a3a6a'); shape(circ(0, 155, 18), '#e8b48e'); x.restore();
  x.restore();
}
function horse(X, Y, s, ph) {
  x.save(); x.translate(X, Y); x.scale(s, s); const c = '#9a5a32', d = '#3a2010';
  shape(ell(0, 6, 160, 16), 'rgba(0,0,0,.18)', null);
  const legs = [[-95, 0], [-60, Math.PI], [70, Math.PI * .5], [105, Math.PI * 1.5]];
  for (const [lx, o] of legs) { x.save(); x.translate(lx, -170); x.rotate(Math.sin(ph + o) * .32); shape(rr(-13, 0, 26, 160, 10), c); shape(rr(-16, 150, 32, 20, 6), d); x.restore(); }
  shape(ell(0, -210, 150, 70), c);
  shape(() => { x.moveTo(-150, -230); x.quadraticCurveTo(-200, -190, -185, -120); x.lineTo(-170, -125); x.quadraticCurveTo(-175, -185, -140, -205); }, d);
  shape(() => { x.moveTo(90, -250); x.lineTo(150, -360); x.lineTo(205, -335); x.lineTo(150, -220); x.closePath(); }, c);
  shape(() => { x.moveTo(150, -365); x.quadraticCurveTo(200, -385, 255, -320); x.quadraticCurveTo(262, -295, 238, -290); x.lineTo(200, -320); x.closePath(); }, c);
  shape(() => { x.moveTo(95, -260); x.lineTo(150, -375); x.lineTo(165, -370); x.lineTo(115, -250); x.closePath(); }, d);
  shape(() => { x.moveTo(160, -372); x.lineTo(172, -405); x.lineTo(182, -368); }, c);
  shape(circ(200, -345, 7), '#111', null);
  x.restore();
}
function gugum(X, Y, s) { x.save(); x.translate(X, Y); x.scale(s, s);
  shape(() => { x.moveTo(-60, 0); x.lineTo(-60, -130); x.quadraticCurveTo(-60, -160, -30, -175); x.lineTo(-30, -205); x.lineTo(30, -205); x.lineTo(30, -175); x.quadraticCurveTo(60, -160, 60, -130); x.lineTo(60, 0); x.closePath(); }, grad(-205, 0, [[0, '#f2f4f6'], [1, '#9ea6ae']]));
  shape(rr(-38, -222, 76, 20, 6), '#cfd3d8'); shape(() => { x.moveTo(-60, -60); x.lineTo(60, -60); }, null, OL, 5); shape(() => { x.ellipse(0, -110, 22, 10, 0, 0, Math.PI * 2); }, '#e3e6ea', OL, 4);
  x.restore(); }
function cart(X, Y, s, rot) { x.save(); x.translate(X, Y); x.scale(s, s);
  shape(rr(-200, -220, 400, 40, 8), '#8b5a2b'); shape(rr(-200, -300, 400, 80, 8), '#2f6db3');
  for (let i = 0; i < 4; i++) gugum(-140 + i * 90, -300, .55);
  shape(() => { x.moveTo(200, -230); x.lineTo(330, -260); }, null, '#6b4a2a', 14);
  x.save(); x.translate(-10, -110); x.rotate(rot); shape(circ(0, 0, 110), null, '#6b4a2a', 16); for (let k = 0; k < 8; k++) { x.save(); x.rotate(k * Math.PI / 4); shape(() => { x.moveTo(0, 0); x.lineTo(0, 105); }, null, '#6b4a2a', 9); x.restore(); } shape(circ(0, 0, 18), '#6b4a2a'); x.restore();
  x.restore(); }
function bell(X, Y, s, rot = 0) { x.save(); x.translate(X, Y); x.rotate(rot); x.scale(s, s); shape(rr(-8, -90, 16, 50, 6), '#5a3a20'); shape(() => { x.moveTo(-40, 20); x.quadraticCurveTo(-36, -45, 0, -45); x.quadraticCurveTo(36, -45, 40, 20); x.closePath(); }, '#e2b23f'); shape(circ(0, 26, 10), '#c9952a'); x.restore(); }
function apartment(X, Y, w, h, wall, seed, lit = .3, night = 0) {
  shape(rr(X, Y - h, w, h, 4), wall); shape(() => { x.moveTo(X - 15, Y - h); x.lineTo(X + w / 2, Y - h - 70); x.lineTo(X + w + 15, Y - h); x.closePath(); }, '#a8432c');
  const cols = Math.max(2, Math.round(w / 110)), rows = Math.round((h - 120) / 150);
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) { const wx = X + 25 + c * (w - 50) / cols, wy = Y - h + 40 + r * 150, ww = (w - 50) / cols - 30; const L = hash(seed * 31 + r * 7 + c) < lit;
    shape(rr(wx - 12, wy, 12, 90, 2), '#7a4a2a', OL, 3); shape(rr(wx + ww, wy, 12, 90, 2), '#7a4a2a', OL, 3);
    shape(rr(wx, wy, ww, 90, 3), L ? '#ffcf73' : (night ? '#2b3150' : '#8fb3c9'), OL, 4); shape(() => { x.moveTo(wx + ww / 2, wy); x.lineTo(wx + ww / 2, wy + 90); }, null, '#f2f2f2', 4);
    if (r > 0 && c === 0) shape(rr(X - 6, wy + 92, w + 12, 12, 3), '#cfc6b4', OL, 3); }
  shape(rr(X + w / 2 - 45, Y - 130, 90, 130, 6), '#5a3216');
}
function street(t, palette = 0) {   // mahalle sokağı (parallax)
  const P = [['#e8d9b8', '#d9c7a7', '#c9d3d6', '#e3cfb0', '#f0c9a8'], ['#a9a69e', '#9c9890', '#a3a8aa', '#a79f92', '#a49a8e']][palette];
  for (let i = 0; i < 6; i++) apartment(-160 + i * 250, 1330, 220, 620 + hash(i + 3) * 260, P[i % 5], i + 7, palette ? .02 : .25);
  shape(rr(-500, 1330, W + 1000, 60, 0), palette ? '#8d8a84' : '#b5aea4', null); shape(rr(-500, 1390, W + 1000, 700, 0), palette ? '#5d5b58' : '#6e6a64', null);
  for (let i = -2; i < 8; i++) shape(rr(i * 220, 1640, 120, 16, 4), '#e8e2d0', null);
}
// ---------- sahneler ----------
const scenes = [
// 0 HOOK
(lt, t) => {
  sky('#4b5fa8', '#ffb98a', lerp(1500, 1050, eout(lt / 4)), '#ffd27a'); cloud(120 + lt * 15, 420, 1.1); cloud(640 + lt * 10, 300, .8);
  x.save(); const z = lerp(1.15, 1, ease(lt / 3)); x.translate(W / 2, H * .62); x.scale(z, z); x.translate(-W / 2, -H * .62);
  street(t);
  const k = eout(lt / 3.2); const cx = lerp(-900, 230, k), walk = lt * 8 * (1 - k * .85);
  cart(cx, 1640, 1.25, -cx / 135); horse(cx + 520, 1640, 1.15, walk);
  const tH = HOOK - S[0];
  man(cx + 130, 1720, 1.55, { leg: walk, armR: lt > .3 ? -2.7 + Math.sin(lt * 18) * .35 : 0, armL: Math.sin(walk) * .3, itemR: () => bell(0, 10, 1.1, Math.PI + Math.sin(lt * 18) * .5), head: lt > tH - .5 ? -.08 : 0 });
  x.restore();
  if (lt > tH - .1) { const s = back((lt - tH + .1) / .5); x.save(); x.translate(W / 2, 640); x.scale(s, s); x.rotate(-.04); x.font = 'bold 230px Cap'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.lineWidth = 40; x.strokeStyle = '#3a1d05'; x.lineJoin = 'round'; x.strokeText('SÜTÇÜ', 0, 0); x.fillStyle = grad(-100, 100, [[0, '#fff3b0'], [.5, '#ffd34a'], [1, '#c47a10']]); x.translate(0, 0); x.fillText('SÜTÇÜ', 0, 0); x.restore(); }
},
// 1 DÖKME
(lt) => {
  sky('#ffe9cc', '#f5d2a5'); x.save(); const z = lerp(1, 1.08, ease(lt / 8)); x.translate(W / 2, 1100); x.scale(z, z); x.translate(-W / 2, -1100);
  shape(rr(-100, 200, 560, 1500, 0), '#c9a77a'); shape(rr(60, 420, 330, 980, 10), '#6b3a1a'); shape(rr(90, 450, 270, 420, 8), '#7f4622'); shape(rr(90, 900, 270, 470, 8), '#7f4622'); shape(circ(330, 900, 16), '#e2b23f');
  shape(rr(-100, 1400, W + 200, 600, 0), '#9a958c', null);
  const tPour = capT('ANNEMİZ') - S[1]; const pot = lerp(-300, 400, eout(lt / 1.2));
  mom(pot - 230, 1250, 1.35, { arm: -1.5 });
  // tencere
  shape(() => { x.moveTo(pot - 130, 1040); x.lineTo(pot - 115, 1220); x.quadraticCurveTo(pot, 1250, pot + 115, 1220); x.lineTo(pot + 130, 1040); x.closePath(); }, '#c94b2a');
  shape(ell(pot, 1040, 132, 30), '#8e2f18'); const lvl = clamp((lt - tPour) / 4.5);
  if (lt > tPour) shape(ell(pot, 1040 + 5, 120 * (.6 + .4 * lvl), 22 * (.6 + .4 * lvl)), '#fbf8f0', null);
  // sütçü + güğüm + ölçek
  gugum(930, 1520, 1.6);
  const pourA = lt > tPour ? Math.sin(Math.min(1, ((lt - tPour) % 1.6) / 1.2) * Math.PI) : 0;
  const ladle = () => { x.save(); x.rotate(-pourA * 1.0); shape(rr(-6, -170, 12, 170, 6), '#cfd3d8'); shape(() => { x.moveTo(-55, -170); x.lineTo(55, -170); x.lineTo(40, -110); x.lineTo(-40, -110); x.closePath(); }, '#cfd3d8'); x.restore(); };
  man(780, 1800, 1.5, { armR: .5, armL: 1.9 - pourA * .4, itemL: ladle, head: .12 });
  if (pourA > .5) { shape(() => { x.moveTo(560, 950); x.quadraticCurveTo(470, 980, pot + 20, 1045); x.lineTo(pot + 45, 1045); x.quadraticCurveTo(480, 1000, 580, 965); }, '#fbf8f0', OL, 4); for (let i = 0; i < 8; i++) { const ph = ((lt * 2) + i / 8) % 1; shape(circ(pot + 30 + Math.cos(i) * 60 * ph, 1040 - Math.sin(ph * Math.PI) * 40, 8), '#fbf8f0', OL, 3); } }
  x.restore();
  if (lt > tPour + 2.2) label(pot, 820, '1 LİTRE', '#fff', '#1b3c7a', 64, -.05);
},
// 2 OCAK
(lt, t) => {
  x.fillStyle = '#e9efe9'; x.fillRect(0, 0, W, H); x.strokeStyle = '#b7c2b7'; x.lineWidth = 5; for (let i = 0; i < W; i += 120) { x.beginPath(); x.moveTo(i, 0); x.lineTo(i, 1300); x.stroke(); } for (let j = 0; j < 1300; j += 120) { x.beginPath(); x.moveTo(0, j); x.lineTo(W, j); x.stroke(); }
  for (let i = 0; i < 9; i++) for (let j = 0; j < 11; j++) if ((i + j) % 3 === 0) shape(circ(60 + i * 120, 60 + j * 120, 16), '#4a8a5a', null);
  const tTas = capT('TAŞAR') - S[2], rise = clamp((lt - .5) / (tTas - .5)), over = clamp((lt - tTas) / 1.2);
  const sh = over > 0 && over < 1 ? Math.sin(lt * 70) * 6 : 0;
  x.save(); const z = lerp(1, 1.12, ease(lt / 7)); x.translate(W / 2 + sh, 1050); x.scale(z, z); x.translate(-W / 2, -1050);
  shape(rr(140, 1200, 800, 700, 26), '#e6dccb'); shape(rr(140, 1200, 800, 70, 26), '#cfc4b0'); shape(rr(200, 1330, 680, 380, 16), '#3a3a3a'); shape(rr(220, 1350, 640, 340, 12), '#5a5a5a');
  for (const kx of [260, 820]) shape(circ(kx, 1240, 22), '#222');
  for (let i = -3; i <= 3; i++) shape(() => { x.ellipse(540 + i * 34, 1186, 14, 30 + Math.sin(t * 30 + i) * 6, 0, 0, Math.PI * 2); }, '#3a8bff', '#1d5fd0', 3);
  // tencere
  shape(() => { x.moveTo(330, 900); x.lineTo(350, 1170); x.quadraticCurveTo(540, 1200, 730, 1170); x.lineTo(750, 900); x.closePath(); }, '#c94b2a');
  for (const sx of [-1, 1]) shape(() => { x.ellipse(540 + sx * 250, 960, 40, 18, 0, 0, Math.PI * 2); }, null, '#222', 12);
  const fy = 900 - rise * 120 - over * 60; shape(() => { x.moveTo(330, 905); x.quadraticCurveTo(540, fy - 140 * (.3 + rise), 750, 905); x.closePath(); }, '#fffdf6');
  for (let i = 0; i < 6; i++) { const k = clamp(over * 1.5 - i * .1); if (k > 0) shape(rr(350 + i * 70, 905, 34, 60 + k * 220, 17), '#fffdf6'); }
  for (let i = 0; i < 10; i++) { const ph = ((lt * .6) + i / 10) % 1; x.globalAlpha = Math.sin(ph * Math.PI) * .6 * (.3 + rise); shape(circ(540 + Math.sin(i * 2 + ph * 4) * 120, 760 - ph * 500, 50 + ph * 80), '#ffffff', null); x.globalAlpha = 1; }
  x.restore();
  if (over > 0) label(820, 700, 'EYVAH!', '#ffe53b', '#111', 72, .12);
},
// 3 KAYMAK
(lt) => {
  x.fillStyle = '#a0643a'; x.fillRect(0, 0, W, H);
